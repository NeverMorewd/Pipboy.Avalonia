name: Publish Pipboy.Avalonia.Fx

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/Pipboy.Avalonia.Fx/Pipboy.Avalonia.Fx.csproj

      - name: Pack
        run: dotnet pack src/Pipboy.Avalonia.Fx/Pipboy.Avalonia.Fx.csproj -c Release -o ./nupkg

      - name: Push
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate