name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.MD'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.MD'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # ---------------- Restore ----------------
      - name: Restore Pipboy.Avalonia
        run: dotnet restore src/Pipboy.Avalonia/Pipboy.Avalonia.csproj

      - name: Restore Pipboy.Avalonia.Fx
        run: dotnet restore src/Pipboy.Avalonia.Fx/Pipboy.Avalonia.Fx.csproj

      - name: Restore Tests
        run: dotnet restore tests/Pipboy.Avalonia.Tests/Pipboy.Avalonia.Tests.csproj

      # ---------------- Build ----------------
      - name: Build Pipboy.Avalonia
        run: dotnet build src/Pipboy.Avalonia/Pipboy.Avalonia.csproj --configuration Release --no-restore

      - name: Build Pipboy.Avalonia.Fx
        run: dotnet build src/Pipboy.Avalonia.Fx/Pipboy.Avalonia.Fx.csproj --configuration Release --no-restore

      # ---------------- Test ----------------
      - name: Run Tests
        run: dotnet test tests/Pipboy.Avalonia.Tests/Pipboy.Avalonia.Tests.csproj --configuration Release --no-restore --verbosity normal